<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HermesOrbit Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px;
    }
    .header {
      max-width: 1100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f2ead8;
      letter-spacing: -0.02em;
    }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7fb08e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .subtitle { color: #8fa79a; font-size: 12px; margin-top: 4px; }
    .diagram-wrap {
      max-width: 1100px;
      margin: 0 auto;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0f1a;
    }
    .diagram-wrap svg { display: block; width: 100%; height: auto; }
    .legend {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="pulse"></div>
    <div>

      <div class="subtitle">iOS SwiftUI app ↔ Hermes Agent control plane</div>
    </div>
  </div>

      <rect width="1080" height="760" fill="url(#grid)"/>

      <rect x="206" y="220" width="68" height="60" rx="6" fill="#12231f" stroke="#7fb08e" stroke-width="1.5"/>
      <text x="240" y="245" text-anchor="middle" font-size="10" fill="#7fb08e" font-weight="600">Ops</text>

      <text x="240" y="272" text-anchor="middle" font-size="8" fill="#8fa79a">Jobs · Logs</text>

      <rect x="284" y="220" width="68" height="60" rx="6" fill="#12231f" stroke="#7fb08e" stroke-width="1.5"/>

      <line x1="240" y1="280" x2="240" y2="300" stroke="#587867" stroke-width="1.5" stroke-dasharray="4,2"/>

      <text x="340" y="540" text-anchor="middle" font-size="10" fill="#8fa79a" font-weight="600">Security</text>
