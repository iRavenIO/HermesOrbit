<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HermesOrbit Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #0a1112;
      color: #e7ece8;
      line-height: 1.5;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    .panel {
      border: 1px solid rgba(255,255,255,0.12);
      padding: 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
    }
    .panel h2 { margin-top: 0; font-size: 22px; letter-spacing: -0.01em; }
    .panel h3 { margin-top: 0; font-size: 18px; }
    .subtitle { opacity: 0.7; font-size: 14px; margin-bottom: 16px; }
    .mockup { border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    .mockup-header {
      background: rgba(255,255,255,0.06);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }
    .mockup-body { padding: 0; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
    .card {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
    }
    .card-image { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .card-body { padding: 14px; }
    .card-body h3 { margin: 0 0 6px; font-size: 15px; }
    .card-body p { margin: 0; font-size: 13px; opacity: 0.75; line-height: 1.45; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 700px) { .options { grid-template-columns: 1fr; } }
    .option {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    .option:hover { background: rgba(255,255,255,0.06); }
    .option.selected { border-color: #79ab89; background: rgba(121,171,137,0.08); }
    .letter {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .content h3 { margin: 0 0 4px; font-size: 15px; }
    .content p { margin: 0; font-size: 13px; opacity: 0.75; }
    .section { margin-top: 24px; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 20px; }
    @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
    .phone { position: relative; aspect-ratio: 9 / 19.5; overflow: hidden; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; max-height: 80vh; margin: 0 auto; }
    .phone.dark { background: linear-gradient(180deg, #081514 0%, #051010 100%); }
    .phone.light { background: linear-gradient(180deg, #f8fbff 0%, #edf3fc 100%); }
    .overlay { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; pointer-events: none; }
    .top { transform: translateY(-18%); }
    .mid { transform: translateY(-2%); }
    .low { transform: translateY(16%); }
    .dark .overlay { opacity: 0.14; }
    .light .overlay { opacity: 0.06; }
    .label { margin-top: 10px; font-size: 13px; opacity: 0.8; }
    .mock-button { cursor: pointer; font-family: inherit; }
    img { max-width: 100%; height: auto; }
    @media (max-width: 640px) {
      .wrap { padding: 12px; gap: 12px; }
      .panel { padding: 12px; }
      .mockup-body { padding: 12px !important; }
      .phone { max-height: 70vh; }
      .option { padding: 10px; }
      .card-body { padding: 10px; }
      [style*="padding:18px"] { padding: 12px !important; }
      [style*="padding:22px"] { padding: 14px !important; }
    }
  </style>
  <script>
    function toggleSelect(el) {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>HermesOrbit Prototype Review</h1>
      <p class="subtitle">Logo applied. Scroll to review all prototype directions.</p>
    </div>

    <div class="panel">
      <h2>Logo Asset</h2>
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
        <div style="text-align:center;">
          <img src="logo-96.png" width="96" height="96" style="border-radius:22px;box-shadow:0 10px 24px rgba(6,17,16,.18);" alt="App icon 96px">
          <div style="margin-top:8px;font-size:12px;opacity:0.7;">96px</div>
        </div>
        <div style="text-align:center;">
          <img src="logo-54.png" width="54" height="54" style="border-radius:14px;" alt="App icon 54px">
          <div style="margin-top:8px;font-size:12px;opacity:0.7;">54px</div>
        </div>
        <div style="text-align:center;">
          <img src="logo-78.png" width="78" height="78" style="border-radius:20px;" alt="App icon 78px">
          <div style="margin-top:8px;font-size:12px;opacity:0.7;">78px</div>
        </div>
      </div>
    </div>

    <div id="prototype-content"></div>
  </div>

  <script>
    async function loadFragment(url) {
      const resp = await fetch(url);
      return resp.text();
    }

    async function init() {
      const container = document.getElementById('prototype-content');
      const files = [
        'consumer-usability-direction.html',
        'foundation-approaches.html',
        'foundation-green-shift.html',
        'foundation-headline-a.html',
        'preview-ready.html'
      ];

      for (const f of files) {
        const html = await loadFragment(f);
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.innerHTML = html;
        container.appendChild(panel);
      }
    }
    init();
  </script>
</body>
</html>
